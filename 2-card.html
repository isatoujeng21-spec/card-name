<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model</title>
    <link rel="stylesheet" href="2-meal.css">
</head>

<body>
    <main>
        <h1>Our Menu</h1>

        <div class="cards-wrapper">

            <div>
                <div class="card">
                    <img src="domoda.jpeg" alt="domoda stew">
                    <h2>Domoda</h2>
                    <p>Groundnut stew with meat and vegetables, and rice</p>
                    <p class="price">D250</p>
                    <button class="button">Order</button>

                </div>
            </div>

            <div class="card">
                <img src="benechine.jpeg" alt="Benechine with stew">
                <h2>Benechine</h2>
                <p>One pot of rice cooked in tomato and spice</p>
                <p class="price">D200</p>
                <button class="button">Order</button>
            </div>

            <div class="card">
                <img src="chicken yassa.jpeg" alt="Chicken yassa">
                <h2>Chicken yassa</h2>
                <p>Chicken in a lemon and sause, with rice</p>
                <p class="price">D300</p>
                <button class="button">Order</button>

            </div>
        </div>

    </main>
</body>

</html>
